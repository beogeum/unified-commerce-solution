<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WMS 블라인드 카운트 — 커머스 운영 OS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#15191F}
a{color:#2350C8}a:hover{color:#163A99}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:10px;border:1px solid #CDD2D9;background:#fff;color:#15191F;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.key{min-height:52px;border-radius:10px;border:1px solid #CDD2D9;background:#fff;font:inherit;font-size:20px;font-weight:600;color:#15191F;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #15191F; display: flex; flex-direction: column">
  <header style="background: #15191F; color: #fff; padding: 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: center"><a href="StockCount.dc.html" style="color: #fff; font-size: 14px; text-decoration: none">← 실사 목록</a><span style="font-size: 13px; color: #C9CED6">화성 자체 WMS · 서창고</span></div>
    <h1 style="margin: 6px 0 0; font-size: 20px">실사 C-2611-08 · Zone B</h1>
    <div style="font-size: 13px; color: #C9CED6">로케이션 13 / 21 완료 · 블라인드 카운트</div>
  </header>

  <main style="flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="현재 로케이션" style="background: #fff; border: 1px solid #E3E6EA; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #59616C">로케이션</span><span style="font-size: 12px; font-weight: 600; color: #1D6A3A; background: #E5F3EA; border-radius: 999px; padding: 2px 8px">스캔 확인됨</span></div>
      <div style="font-size: 30px; font-weight: 700">B-02-01</div>
      <div style="font-size: 15px; font-weight: 600">젠틀 클렌징폼 300ml · CLF-300</div>
      <div style="font-size: 13px; color: #59616C">LOT 2611-C · 이 로케이션의 SKU 2개 중 1번째</div>
    </section>

    <section aria-label="수량 입력" style="background: #fff; border: 1px solid #E3E6EA; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #59616C">센 수량 (낱개)
        <input type="text" inputmode="numeric" value="37" style="min-height: 56px; border: 2px solid #2350C8; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 28px; font-weight: 700; color: #15191F; background: #fff">
      </label>
      <div style="font-size: 13px; color: #59616C">시스템 수량은 표시하지 않습니다. 박스 단위로 셌다면 낱개로 바꿔 입력하세요.</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
        <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
        <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
        <button class="key" type="button" aria-label="지우기">⌫</button><button class="key" type="button">0</button><button class="key" type="button" aria-label="사진 첨부">사진</button>
      </div>
    </section>
  </main>

  <footer style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: #fff; border-top: 1px solid #E3E6EA">
    <button class="btn" type="button">빈 로케이션</button>
    <button class="btn" type="button" style="background: #2350C8; border-color: #2350C8; color: #fff">저장 · 다음 SKU</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
