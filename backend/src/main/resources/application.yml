spring:
  application:
    name: commerce-os
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_os}
    username: ${DB_USER:commerce_os}
    password: ${DB_PASSWORD:commerce_os}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  threads:
    virtual:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{request_id:-}]"

commerce:
  auth:
    # DLG-012: 절대 만료 12시간 + 비활동 만료 2시간
    session-ttl: PT12H
    idle-timeout: PT2H
    max-failed-logins: 5
    lock-duration: PT15M
    # DLG-014: 이 역할 보유자는 TOTP 2단계 인증 등록 필수. 미완료 세션은 10분 안에 인증해야 한다.
    mfa-required-roles: SUPER_ADMIN,OPS_ADMIN
    mfa-pending-ttl: PT10M
  idempotency:
    retention: PT24H
  jobs:
    lease: PT5M
  exports:
    ttl: PT24H
  files:
    local-root: ${FILES_ROOT:./data/files}
  workers:
    enabled: true
  integration:
    # 실제 채널·3PL 커넥터는 계정 권한 확인 전까지 없음. 모의 커넥터는 개발·테스트 전용(DEC-F08)
    mock-connectors-enabled: ${MOCK_CONNECTORS_ENABLED:false}
    error-threshold: 3
  crypto:
    # 운영에서는 반드시 Secret Store/KMS 에서 주입(OQ-027). 아래 기본값은 없음 → 미설정 시 기동 실패.
    active-key-id: ${CRYPTO_ACTIVE_KEY_ID:}
    keys:
      k1: ${CRYPTO_KEY_K1:}
    hmac-key: ${CRYPTO_HMAC_KEY:}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    workspace-code: ${BOOTSTRAP_WORKSPACE_CODE:demo}
    workspace-name: ${BOOTSTRAP_WORKSPACE_NAME:데모 운영그룹}
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:admin@example.com}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
