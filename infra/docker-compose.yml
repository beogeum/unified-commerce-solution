# 개발용. 운영 배포 구성은 docs/16 과 별도 ADR 로 정한다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce_os
      POSTGRES_USER: commerce_os
      POSTGRES_PASSWORD: commerce_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
